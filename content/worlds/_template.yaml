# 새 세계를 만들려면 이 파일을 복사해서 <id>.yaml 로 저장하세요.
# ('_' 로 시작하는 파일은 불러오지 않습니다.)
#
# 사용할 수 있는 anchor
#   오리온 ◉ 별 : meissa, betelgeuse, alnitak, rigel
#   오리온 작은 점 별 (YAML을 추가하면 ◉ 로 바뀝니다) : bellatrix, mintaka, alnilam, saiph
#   흰 궤도의 부유하는 배 : ship
#   회색 궤도의 조각난 세계 : fragment
#
# 주의 1: '#' 이 들어간 글은 반드시 따옴표로 감싸세요. 따옴표가 없으면 '#' 뒤가 주석으로 잘립니다.
# 주의 2: 'content: |' 아래의 글은 앞에 공백 2칸 이상 들여써야 합니다.

id: betelgeuse             # 파일 이름과 같게 (betelgeuse.yaml)
anchor: betelgeuse         # 화면에서 붙을 자리 (위 목록 중 하나, 다른 파일과 겹치면 안 됨)
label: "관측된 세계 #2390" # 대상 아래에 뜨는 이름
eyebrow: OBSERVED · 2390   # 패널 맨 위 작은 영문
title: 관측된 세계          # 패널 제목 (타이핑 효과)
verdict: 부적격             # 판단 결과

# 내용은 두 가지 중 하나로 씁니다.
#
# (1) 글 하나 — 공용 글꼴로 나옵니다.
#
# content: |
#   쿨쿨따쿨쿨띠
#
# (2) 필자별 문단 — 문단마다 '- 필자키: 글' 로 씁니다. 필자 글꼴로 나옵니다.
#     필자 키는 content/authors.yaml 에 있는 것(r, i …)이고, 필자 이름은 화면에 나오지 않습니다.
#     문단 하나에는 필자 키 하나만 쓸 수 있습니다. 여러 줄은 '|' 를 쓰세요.
content:
  - r: |
      첫 문단 (필자 r)
      두 번째 줄
  - i: 다음 문단 (필자 i)
