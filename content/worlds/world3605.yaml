content:
  - r: |
      이 세계는 내가 살던 세계와 아주 비슷하네.
      닮은 세계가 종종 튀어나오는데, 이유가 뭘까?
  - i: |
      뿌리가 같은건가?
  - r: |
      비가 계속 내리는 세계라. 마음에 드는데...
      다만, 음... 안타깝게 됐어, 일룩시아.
      널 담기엔 이 세계는 너무 작네...
  - i: |
      뚱뚱하다고 놀리는거지?!
  - r: |
      ...그 뜻이 아니잖아!
