label: "관측된 세계 #2146"
eyebrow: WORLD · 1264
title: 관측된 세계
verdict: 부적격
content:
  - i: |
      왜 학생들이 전쟁에 동원되는거야?
  - r: |
      짚고 넘어가자면 미성년자들은 징집 대상이 아니야.
      끌려간 건 아카데미의 성인 학생들이지.
  - i: |
      그래도 모두 보호받아야 할 학생이잖아.
  - r: |
      아카데미의 학생은 우수할테니 좋은 병력이 될거야.
      일룩시아, 너도 마법사들이 얼마나 무서운지 잘 알고 있잖아.
  - i: |
      유쾌한 이야기는 아닌걸...
  - r: |
      어른이 되지 못했네. 너도, 학생들도.
