eyebrow: WORLD · 2153
title: 관측된 세계
verdict: 부적격
content:
  - r: |
      우리가 타인을 사랑할 수 있을까?
      그 사람을 위해 내 모든 시간을 버릴 수 있을 정도로.
  - i: |
      라온. 나이들었어? 외곽 주민한테 뭘 바라는거야~
  - r: |
      아야. 그 녀석이 '시간'을 돌린다고 저지른 짓이 딱 그거잖아.
      그거... 맹목에 가깝지 않나.
  - i: |
      그래도, 덕분에 다락이를 볼 수 있었는걸?
  - r: |
      ...따지자면... 잔이 원인이긴 하지.
  - i: |
      그 녀석은 싫어.
  - r: |
      확고해서 좋네. 난 셋 다 싫어.

